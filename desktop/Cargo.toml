# The desktop app's Rust: the runner connection and the GPUI app, built
# together with one lock file and one target folder.
[workspace]
resolver = "2"
members = ["client", "core", "gpui", "dock", "dock/layout", "web"]
# A copy of a published crate, built as a dependency only (below).
exclude = ["vendor"]

# gpui-kit's components, as published at 0.9.0, with this app's changes on
# top: its popup menus drawn as macOS draws its own (the tick column beside
# the icon, the metrics, the highlight), which nothing outside the crate can
# reach (Mike, 12 Nov: the Inbox's sort menu "not spaced properly", and no
# tick). `git log -p desktop/vendor` shows what's ours: the first commit
# there is the crate as published. On a gpui-kit bump, copy the new version
# in from ~/.cargo/registry/src and put those changes back on it.
#
# gpui-kit's base, the same way: the first commit under vendor/gpui-base is
# 0.9.0 as published. Ours on top: a TextViewStyle switch for the hairline
# the kit draws under every link, which Swift's replies don't have (Mike,
# 12 Nov: "the links are underlined in the GPUI version"). And a selection
# takes in a soft-wrapped row's first character, which GPUI places at the end
# of the row above (`wrapped_row_starts`, `drawn_position`; Mike, 13 Nov:
# "can't select all the way to the start of the line"). And a test
# snapshot's `visible_bounds`, what's drawn of an element inside its clips,
# so scripted clicks land on it rather than its whole middle, which for one
# scrolled half out of a pane is over its neighbour (13 Nov).
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
gpui-base = { path = "vendor/gpui-base" }
# gpui-pre 0.3.11 as published, with file drags switching out of keyboard
# modality before hover hit tests (window.rs). Otherwise a drop after typing
# reaches no target. Keep this patch when updating the snapshot. Also
# Window::element_opacity made public, for the sidebar's turning arcs
# (gpui/src/spinner.rs).
gpui-pre = { path = "vendor/gpui-pre" }
